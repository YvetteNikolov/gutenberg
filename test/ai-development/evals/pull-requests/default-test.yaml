# Grading contract shared by every agent config for this eval target.
#
# Scaffold: these assertions demonstrate the wiring, not the finished rubric.
# Every one is a promptfoo built-in reading normalised provider metadata —
# nothing here parses raw shell strings or hand-rolls a transcript shape.
#
#   skill-used            <- metadata.skillCalls
#   trajectory:tool-used  <- metadata.toolCalls
#   word-count            <- output
#   llm-rubric            <- output, graded by promptfoo's default grader
#
# Naming a metric per assertion keeps the report diagnostic: a red row says
# which dimension failed rather than collapsing to one pass/fail.
#
# `skill-used` is expected to FAIL on the control arm — the control fixture has
# no skill to discover. That failure is the measurement, not a defect.
options:
    bustCache: true
assert:
    - type: skill-used
      value: pull-requests
      metric: Skill discovery

    - type: trajectory:tool-used
      value:
          pattern: '*'
          min: 1
      metric: Did any work

    - type: word-count
      value:
          max: 450
      metric: Succinct

    - type: llm-rubric
      value: |
          Placeholder rubric — replace when defining what this eval measures.

          Pass if the response is a pull request description that a reviewer
          could act on: it says what changed and why, and its testing steps end
          in an observable result.
      threshold: 0.8
      metric: Reviewer usefulness
