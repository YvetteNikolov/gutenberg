# Eval: does the pull-requests skill make Claude Code author PR descriptions
# that follow .github/PULL_REQUEST_TEMPLATE.md and skills/pull-requests/SKILL.md?
#
# Two providers run the identical task in disposable fixture repositories. The
# fixtures differ only in whether the pull-requests skill and its routing are
# present, so the candidate-control delta measures the guidance under test.
#
# The prompt and grading contract are shared with the Codex config; the commit
# under test is owned by pull-requests/fixture-repo.mjs.
#
# `file://` paths resolve relative to this file's directory.
description: Verify the pull-requests skill is discovered, followed, and produces a review-ready PR description

prompts:
    - id: file://prompt.md
      label: Author a PR description

providers:
    - id: file://../shared/agent-provider.mjs
      label: Claude Code with repo guidance
      config:
          agent: claude
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          guidance: candidate
          setting_sources: ['project']

    - id: file://../shared/agent-provider.mjs
      label: Claude Code control guidance
      config:
          agent: claude
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          guidance: control
          setting_sources: ['project']

defaultTest: file://default-test.yaml

tests:
    - description: PR description for the Notes caret-to-sidebar selection sync commit
      vars:
          case: notes-caret-sidebar-sync

evaluateOptions:
    maxConcurrency: 1
    repeat: 2

outputPath: results/raw/pull-requests-claude.json
