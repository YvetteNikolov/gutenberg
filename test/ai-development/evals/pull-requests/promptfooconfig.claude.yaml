# Eval: does the pull-requests skill make Claude Code author PR descriptions
# that follow .github/PULL_REQUEST_TEMPLATE.md and skills/pull-requests/SKILL.md?
#
# Two providers run the identical task in disposable fixture repositories. The
# fixtures differ only in whether the pull-requests skill and its routing are
# present, so the candidate-control delta measures the guidance under test.
#
# The wrapper provider owns only the fixture; `provider` names the built-in
# promptfoo agent provider that actually runs the agent and normalises its
# trajectory. The prompt and grading contract are shared with the Codex config;
# the commit under test is owned by pull-requests/fixture-repo.mjs.
#
# The two provider blocks are spelled out rather than sharing a YAML anchor:
# promptfoo's parser does not resolve `<<:` merge keys, so an anchored block
# silently yields an undefined provider.
#
# `file://` paths resolve relative to this file's directory.
description: Verify the pull-requests skill is discovered, followed, and produces a review-ready PR description

prompts:
    - id: file://prompt.md
      label: Author a PR description

providers:
    - id: file://../shared/agent-provider.mjs
      label: Claude Code with repo guidance
      config:
          provider: anthropic:claude-code
          provider_config:
              model: sonnet
              max_turns: 50
              # Only project-level instructions, so the developer's own
              # ~/.claude guidance cannot leak into the subject.
              setting_sources: ['project']
              custom_allowed_tools: ['Bash', 'Read', 'Glob', 'Grep']
              disallowed_tools:
                  [
                      'Write',
                      'Edit',
                      'NotebookEdit',
                      'Task',
                      'WebFetch',
                      'WebSearch',
                  ]
              # Forwarded to the Claude Agent SDK verbatim, so these keys are
              # the SDK's camelCase `SandboxSettings`, unlike the snake_case
              # keys above. The wrapper fills in filesystem allowRead/allowWrite
              # with the fixture path at run time.
              sandbox:
                  enabled: true
                  failIfUnavailable: true
                  autoAllowBashIfSandboxed: true
                  allowUnsandboxedCommands: false
                  network:
                      allowedDomains: []
                      allowManagedDomainsOnly: true
                  filesystem:
                      allowManagedReadPathsOnly: true
              # TODO: confirm the `sandbox` sub-schema against the installed
              # 0.121.x provider before the first live run — network must be
              # disabled and writes confined to working_dir.
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          guidance: candidate

    - id: file://../shared/agent-provider.mjs
      label: Claude Code control guidance
      config:
          provider: anthropic:claude-code
          provider_config:
              model: sonnet
              max_turns: 50
              setting_sources: ['project']
              custom_allowed_tools: ['Bash', 'Read', 'Glob', 'Grep']
              disallowed_tools:
                  [
                      'Write',
                      'Edit',
                      'NotebookEdit',
                      'Task',
                      'WebFetch',
                      'WebSearch',
                  ]
              # Forwarded to the Claude Agent SDK verbatim, so these keys are
              # the SDK's camelCase `SandboxSettings`, unlike the snake_case
              # keys above. The wrapper fills in filesystem allowRead/allowWrite
              # with the fixture path at run time.
              sandbox:
                  enabled: true
                  failIfUnavailable: true
                  autoAllowBashIfSandboxed: true
                  allowUnsandboxedCommands: false
                  network:
                      allowedDomains: []
                      allowManagedDomainsOnly: true
                  filesystem:
                      allowManagedReadPathsOnly: true
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          guidance: control

defaultTest: file://default-test.yaml

tests:
    - description: PR description for the Notes caret-to-sidebar selection sync commit
      vars:
          case: notes-caret-sidebar-sync

evaluateOptions:
    maxConcurrency: 2
    repeat: 2

outputPath: results/raw/pull-requests-claude.json
