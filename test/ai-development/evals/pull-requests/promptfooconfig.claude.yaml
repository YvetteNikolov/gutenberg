# Eval: does the pull-requests skill make Claude Code author PR descriptions
# that follow .github/PULL_REQUEST_TEMPLATE.md and skills/pull-requests/SKILL.md?
#
# Two providers run the identical task in disposable fixture repositories. The
# fixtures differ only in whether the pull-requests skill and its routing are
# present, so the candidate-control delta measures the guidance under test.
description: Verify the pull-requests skill is discovered, followed, and produces a review-ready PR description

prompts:
    - label: Author a PR description
      raw: |
          The fixture repository contains a baseline commit followed by exactly one
          pull request commit at HEAD. Author the pull request description for the
          committed change at HEAD. Your final answer must be only the PR description
          markdown, with no preamble or commentary.

providers:
    - id: file://shared/agent-provider.mjs
      label: Claude Code with repo guidance
      config:
          agent: claude
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          fixture_commit: 1f27df2962c8f459582eeb41435251713f30c810
          guidance: candidate
          setting_sources: ['project']

    - id: file://shared/agent-provider.mjs
      label: Claude Code control guidance
      config:
          agent: claude
          evaluation: pull-requests
          fixture_module: pull-requests/fixture-repo.mjs
          fixture_commit: 1f27df2962c8f459582eeb41435251713f30c810
          guidance: control
          setting_sources: ['project']

defaultTest:
    options:
        bustCache: true
    assert:
        - type: javascript
          value: file://pull-requests/grade-pr-description.cjs
          threshold: 1
          metric: Skill compliance checks
        - type: llm-rubric
          value: |
              Judge whether this PR description would let a Gutenberg reviewer quickly
              understand and test the change.

              Context: the pull request changes the Notes (collab sidebar) feature so
              that placing the caret inside an inline note marker in the editor content
              selects/highlights the corresponding note in the Notes sidebar. It touches
              packages/editor/src/components/collab-sidebar/format.js and extends
              test/e2e/specs/editor/various/block-notes.spec.js to cover the behavior.

              Pass only if the What/Why accurately describe the caret-to-sidebar
              selection sync in plain language (not a vague file inventory), the testing
              instructions are concrete editor steps ending in an observable result, and
              the description stays succinct. Fail if it invents behavior that is not in
              the change, buries the point in implementation detail, or pads testing
              steps with environment setup.
          threshold: 0.8
          metric: Reviewer usefulness
          provider:
              id: file://shared/agent-provider.mjs
              config:
                  agent: claude
                  role: judge
                  model: sonnet

tests:
    - description: PR description for the Notes caret-to-sidebar selection sync commit
      vars:
          case: notes-caret-sidebar-sync

evaluateOptions:
    maxConcurrency: 1
    repeat: 2

outputPath: results/raw/pull-requests-claude.json
