# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# How to run the agents for this target. What is actually being measured lives
# in tests.yaml, and the task itself in prompt.md.
#
# Both agents live in this one config; promptfoo runs the matrix. Use
# `--filter-providers claude` (or `codex`) to run just one.
#
# `file://` paths resolve relative to this file's directory.
description: Verify an e2e task routes through the testing skill to the e2e reference only

prompts:
    - id: file://prompt.md
      label: Add an e2e test

extensions:
    - file://../../lib/workspace-extension.mjs:extensionHook

providers:
    - id: anthropic:claude-agent-sdk
      label: claude
      config:
          # Let the Claude CLI use its existing subscription login.
          apiKeyRequired: false
          model: sonnet
          max_turns: 30
          # Only project-level instructions, so the developer's own
          # ~/.claude guidance cannot leak into the subject.
          setting_sources: ['project']
          # Use Bash for reads so Promptfoo can represent both Claude's Bash
          # calls and Codex's exec_command calls as command trajectory steps.
          tools: ['Bash', 'Edit', 'Write']
          custom_allowed_tools: ['Bash', 'Edit', 'Write']
          disallowed_tools: ['Task', 'WebFetch', 'WebSearch']

    - id: openai:codex-sdk
      label: codex
      config:
          sandbox_mode: workspace-write
          approval_policy: never
          network_access_enabled: false
          web_search_mode: disabled
          # Streaming emits Promptfoo's normalized Codex trajectory spans;
          # deep tracing connects the Codex CLI's own spans to the trace.
          enable_streaming: true
          deep_tracing: true

tests: file://tests.yaml

tracing:
    enabled: true
    failOnReceiverStartFailure: true
    # Promptfoo recognizes Codex's exec_command by default. Claude calls its
    # equivalent shell tool Bash, so declare that additional command tool name.
    commandToolNames: ['Bash']
    otlp:
        http:
            enabled: true
            host: 127.0.0.1
            port: 4318
            acceptFormats: ['json']

evaluateOptions:
    maxConcurrency: 2
    repeat: 2

outputPath: results/raw/testing.json
