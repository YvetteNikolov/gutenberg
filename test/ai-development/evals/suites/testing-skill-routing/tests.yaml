# What this target measures. The config alongside it only says how to run the
# agents; everything about the behaviour under test lives here.
#
# `skills/testing/SKILL.md` is a router: it defers to references/jest.md,
# references/php.md or references/e2e.md depending on the kind of test. An
# end-to-end task should take the e2e branch and leave the other two unread.
#
# `skill-used` cannot express that — the skill is `testing` either way, and the
# distinction is which reference was opened. Promptfoo normalizes both agents'
# shell calls into provider-independent command trajectory steps.
- description: e2e test for unencoded ampersands in the paragraph block
  options:
      bustCache: true
      # Promptfoo's beforeEach extension fills in working_dir and the dynamic
      # filesystem allowlists. Codex ignores this Claude-specific sandbox key.
      sandbox:
          enabled: true
          failIfUnavailable: true
          autoAllowBashIfSandboxed: true
          allowUnsandboxedCommands: false
          network:
              allowedDomains: []
              allowManagedDomainsOnly: true
          filesystem:
              allowManagedReadPathsOnly: true
      # Give deterministic graders the final response and diff.
      transform: file://artifact-grader.mjs:includeWorkspaceArtifact
      # The workspace extension adds this row's temporary working_dir.
      provider:
          id: openai:codex-sdk
          config:
              sandbox_mode: read-only
              approval_policy: never
              network_access_enabled: false
              web_search_mode: disabled
  assert:
      - type: trajectory:step-count
        value:
            type: command
            pattern: '*skills/testing/references/e2e.md*'
            min: 1
        metric: Read the e2e reference

      - type: trajectory:step-count
        value:
            type: command
            pattern: '*skills/testing/references/jest.md*'
            max: 0
        metric: Skipped the Jest reference

      - type: trajectory:step-count
        value:
            type: command
            pattern: '*skills/testing/references/php.md*'
            max: 0
        metric: Skipped the PHPUnit reference

      - type: javascript
        value: file://artifact-grader.mjs:changedE2eSpec
        metric: Changed an E2E spec

      - type: javascript
        value: file://artifact-grader.mjs:changedOnlyE2eTests
        metric: Kept changes scoped to E2E tests

      - type: javascript
        value: file://artifact-grader.mjs:usedAccessibleParagraphLocator
        metric: Used the accessible paragraph locator

      - type: javascript
        value: file://artifact-grader.mjs:enteredLiteralAmpersand
        metric: Entered a literal ampersand

      - type: javascript
        value: file://artifact-grader.mjs:assertedUnencodedAmpersand
        metric: Asserted unencoded content

      - type: agent-rubric
        value: |
            Inspect the available workspace and its Git diff. Pass only if the
            diff adds a focused Gutenberg Playwright E2E test
            that enters a literal `&` in a paragraph through the editor UI and
            explicitly verifies it remains `&`, not `&amp;`. The test should
            find the block through `editor.canvas.getByRole( 'document', {
            name: 'Block: Paragraph' } )` and follow nearby conventions.
            Evaluate the workspace rather than claims in the response.
        metric: Agent review of test quality
