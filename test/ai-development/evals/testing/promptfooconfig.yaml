# Eval: given an e2e task, does an agent follow skills/testing/SKILL.md to the
# e2e reference and leave the Jest and PHPUnit references unread?
#
# `skills/testing/SKILL.md` is a router: it defers to references/jest.md,
# references/php.md or references/e2e.md depending on the kind of test. This is
# a progressive-disclosure check — take the right branch, ignore the other two.
#
# Both agents live in this one config; promptfoo runs the matrix. Use
# `--filter-providers claude` (or `codex`) to run just one.
#
# `file://` paths resolve relative to this file's directory.
description: Verify an e2e task routes through the testing skill to the e2e reference only

prompts:
    - label: Add an e2e test
      raw: |
          Add an end-to-end test for the paragraph block covering this behaviour:
          typing an ampersand (`&`) into a paragraph in the editor must leave it
          as `&`, not encode it as `&amp;`.

          Follow this repository's conventions for the kind of test you are
          writing.

providers:
    # The wrapper owns only the disposable fixture; `provider` names the
    # built-in promptfoo provider that runs the agent and normalises its
    # trajectory into metadata.toolCalls.
    - id: file://../shared/agent-provider.mjs
      label: claude
      config:
          provider: anthropic:claude-code
          fixture_module: testing/fixture-repo.mjs
          provider_config:
              model: sonnet
              max_turns: 30
              # Only project-level instructions, so the developer's own
              # ~/.claude guidance cannot leak into the subject.
              setting_sources: ['project']
              disallowed_tools: ['Task', 'WebFetch', 'WebSearch']
              # Forwarded to the Claude Agent SDK verbatim, so these keys are
              # the SDK's camelCase `SandboxSettings`. The wrapper fills in
              # filesystem allowRead/allowWrite with the fixture path.
              sandbox:
                  enabled: true
                  failIfUnavailable: true
                  autoAllowBashIfSandboxed: true
                  allowUnsandboxedCommands: false
                  network:
                      allowedDomains: []
                      allowManagedDomainsOnly: true
                  filesystem:
                      allowManagedReadPathsOnly: true

    - id: file://../shared/agent-provider.mjs
      label: codex
      config:
          provider: openai:codex-sdk
          fixture_module: testing/fixture-repo.mjs
          provider_config:
              sandbox_mode: workspace-write
              approval_policy: never
              network_access_enabled: false
              web_search_mode: disabled
              skip_git_repo_check: true

# `skill-used` cannot express this check: the skill is `testing` either way, and
# the distinction is which reference file was opened. `transform` receives the
# provider response metadata, so each assertion stringifies the run's normalised
# tool calls and matches a path with a built-in matcher. Nothing custom is
# loaded.
tests:
    - description: e2e test for unencoded ampersands in the paragraph block
      options:
          bustCache: true
      assert:
          - type: contains
            transform: JSON.stringify(context.metadata?.toolCalls ?? [])
            value: skills/testing/references/e2e.md
            metric: Read the e2e reference

          - type: not-contains
            transform: JSON.stringify(context.metadata?.toolCalls ?? [])
            value: skills/testing/references/jest.md
            metric: Skipped the Jest reference

          - type: not-contains
            transform: JSON.stringify(context.metadata?.toolCalls ?? [])
            value: skills/testing/references/php.md
            metric: Skipped the PHPUnit reference

evaluateOptions:
    maxConcurrency: 2
    repeat: 2

outputPath: results/raw/testing.json
